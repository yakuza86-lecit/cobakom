<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mengalihkan…</title>
<meta name="theme-color" content="#070912">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="6;url=https://paketlengkap.konabreezeobx.com/daftar-paket-lengkap-di-sini.html">
<style>
:root{
  --bg:#070912; --ink:#eef2ff; --muted:#d9a9a9;
  --a:#ff2b2b; --b:#ff7a45; --c:#ffd805;
  --line:rgba(255,120,120,.16); --glass:rgba(15,20,40,.62);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--bg);min-height:100%;overflow-x:hidden;
  display:flex;align-items:center;justify-content:center;padding:28px 16px;position:relative;
}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(46px);opacity:.55;
  background:
    radial-gradient(38% 34% at 18% 20%,rgba(255,43,43,.55),transparent 70%),
    radial-gradient(40% 36% at 84% 24%,rgba(255,122,69,.42),transparent 72%),
    radial-gradient(46% 40% at 60% 92%,rgba(255,216,5,.30),transparent 74%);
  animation:drift 14s ease-in-out infinite alternate;
}
@keyframes drift{to{transform:translate3d(0,-18px,0) scale(1.06)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;
  background-image:radial-gradient(rgba(255,255,255,.5) .6px,transparent .6px);
  background-size:3px 3px}
.card{
  position:relative;z-index:3;width:100%;max-width:430px;border-radius:24px;padding:1px;
  background:linear-gradient(150deg,rgba(255,43,43,.6),rgba(255,122,69,.35) 45%,rgba(255,216,5,.30));
  box-shadow:0 34px 90px rgba(0,0,0,.62);
  transition:opacity .45s ease,transform .45s ease,filter .45s ease;
}
.card.out{opacity:0;transform:translateY(10px) scale(.985);filter:blur(3px)}
.inner{
  border-radius:23px;padding:26px 22px 22px;
  background:linear-gradient(180deg,rgba(16,21,42,.92),rgba(8,11,24,.96));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:center;
}
.spin{width:64px;height:64px;margin:2px auto 16px;position:relative}
.spin i{position:absolute;inset:0;border-radius:50%;border:2.5px solid transparent}
.spin i:nth-child(1){border-top-color:var(--a);border-right-color:var(--b);animation:rot 1.25s linear infinite;filter:drop-shadow(0 0 8px rgba(255,43,43,.6))}
.spin i:nth-child(2){inset:9px;border-bottom-color:var(--c);border-left-color:rgba(255,122,69,.7);animation:rot 1.9s linear infinite reverse}
.spin b{position:absolute;inset:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd0d0,var(--a) 55%,#5c0a0a);box-shadow:0 0 24px rgba(255,43,43,.7);animation:pulse 1.6s ease-in-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.86);opacity:.8}50%{transform:scale(1);opacity:1}}
h1{font-size:19px;font-weight:750;letter-spacing:.2px}
h1 span{background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);font-size:13.5px;line-height:1.6;margin-top:7px;font-weight:400}
.chips{display:flex;gap:8px;margin-top:18px}
.chips div{flex:1;border:1px solid var(--line);background:rgba(255,120,120,.05);border-radius:12px;padding:9px 6px;font-size:11px;color:var(--muted);letter-spacing:.3px}
.chips b{display:block;font-size:12px;color:var(--ink);margin-bottom:2px;font-weight:650}
.bar{margin-top:18px;height:8px;border-radius:99px;background:rgba(255,120,120,.13);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 16px rgba(255,122,69,.45);transition:width .18s linear}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--muted)}
.row b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{
  margin-top:16px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 18px;border-radius:14px;text-decoration:none;color:#140404;font-weight:750;font-size:14px;
  background:linear-gradient(95deg,var(--b),#ffb3a3 45%,var(--c));
  box-shadow:0 12px 28px rgba(255,122,69,.22),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .15s ease,box-shadow .15s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 16px 34px rgba(255,43,43,.32)}
.btn svg{width:15px;height:15px}
.note{margin-top:13px;font-size:11.5px;color:#b98a8a;line-height:1.55}
.note[hidden]{display:none}
.foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:#a97676;letter-spacing:.3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"></div>
<div class="grain"></div>

<main class="card" id="card">
  <div class="inner">
    <div class="spin" aria-hidden="true"><i></i><i></i><b></b></div>

    <h1>Mengalihkan ke <span>tujuan</span></h1>
    <p>Menyiapkan koneksi aman. Halaman tujuan akan terbuka otomatis.</p>

    <div class="chips">
      <div><b>Aman</b>koneksi terenkripsi</div>
      <div><b>Cepat</b>tanpa unduhan</div>
      <div><b>Ringan</b>hemat data</div>
    </div>

    <div class="bar"><i id="fill"></i></div>
    <div class="row"><span>Membuka otomatis</span><b id="left">6s</b></div>

    <a class="btn" id="go" href="https://paketlengkap.konabreezeobx.com/daftar-paket-lengkap-di-sini.html" rel="noopener">
      Lanjutkan Sekarang
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg>
    </a>

    <p class="note" id="note" hidden>Jika tidak teralihkan otomatis, tekan tombol di atas.</p>
    <div class="foot">Terima kasih telah menunggu</div>
  </div>
</main>

<script>
(function(){
  var TARGET = "https://paketlengkap.konabreezeobx.com/daftar-paket-lengkap-di-sini.html";
  var SECONDS = 6;
  var left = SECONDS, done = false;
  var fill = document.getElementById('fill');
  var out  = document.getElementById('left');
  var card = document.getElementById('card');
  var note = document.getElementById('note');
  var go   = document.getElementById('go');
  go.href = TARGET;

  var t0 = Date.now();
  var timer = setInterval(function(){
    var el = (Date.now() - t0) / 1000;
    var pct = Math.min(100, (el / SECONDS) * 100);
    fill.style.width = pct + '%';
    var s = Math.max(0, Math.ceil(SECONDS - el));
    if (s !== left){ left = s; out.textContent = s + 's'; }
    if (el >= SECONDS && !done){ clearInterval(timer); goNow(); }
  }, 90);

  function goNow(){
    if (done) return;
    done = true;
    card.classList.add('out');
    document.body.style.cursor = 'progress';
    setTimeout(function(){ window.location.replace(TARGET); }, 220);
    setTimeout(function(){ if (!document.hidden){ note.hidden = false; } }, 2600);
  }

  go.addEventListener('click', function(e){ e.preventDefault(); goNow(); });

  // fallback kalau timer dibekukan browser
  setTimeout(function(){ if (!done) goNow(); }, (SECONDS + 2) * 1000);
})();
</script>
</body>
</html>
